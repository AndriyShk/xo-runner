<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #f97316;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181d;
          --fg: #f3f4f6;
          --muted: #9ca3af;
          --line: #2b2f36;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 268px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      h1 span { font-size: 16px; }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .row:first-of-type { border-top: 0; }
      label { color: var(--muted); }
      select, input[type="color"] {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 6px;
        font: inherit;
      }
      input[type="color"] { padding: 1px; width: 34px; height: 24px; }
      input[type="range"] { width: 118px; accent-color: var(--accent); }
      .switch { position: relative; width: 38px; height: 22px; flex: none; }
      .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
      .track {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--line);
        transition: background 0.15s;
        pointer-events: none;
      }
      .track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .switch input:checked ~ .track { background: var(--accent); }
      .switch input:checked ~ .track::after { transform: translateX(16px); }
      #status {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11.5px;
        min-height: 30px;
      }
      #status b { color: var(--fg); font-weight: 600; }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 5px;
        background: var(--muted);
      }
      .ok { background: #22c55e; }
      .warn { background: #f59e0b; }
      .err { background: #ef4444; }
    </style>
  </head>
  <body>
    <h1><span>🏃</span> XO Pulse Runner</h1>

    <div class="row">
      <label for="enabled">Увімкнено</label>
      <span class="switch">
        <input type="checkbox" id="enabled" />
        <span class="track"></span>
      </span>
    </div>

    <div class="row">
      <label for="mode">Режим</label>
      <select id="mode">
        <option value="cycle">Біг → відпочинок → назад</option>
        <option value="tip">Тримається вістря</option>
      </select>
    </div>

    <div class="row">
      <label for="scale">Розмір</label>
      <input type="range" id="scale" min="0.5" max="2.2" step="0.1" />
    </div>

    <div class="row">
      <label for="speed">Темп</label>
      <input type="range" id="speed" min="0.4" max="2.2" step="0.1" />
    </div>

    <div class="row">
      <label for="debug">Debug</label>
      <span class="switch">
        <input type="checkbox" id="debug" />
        <span class="track"></span>
      </span>
    </div>

    <div id="status"><span class="dot"></span>перевіряю…</div>

    <script src="popup.js"></script>
  </body>
</html>
